# Weekly dependency updates (free on every plan). Commit messages follow Conventional Commits: chore(deps) releases
# nothing; a security fix still deserves a fix(deps) title when merged, since the bundle ships the dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*', 'zod']
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@modelcontextprotocol/*', 'zod', 'pino', '@sentry/*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
