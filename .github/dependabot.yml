# Weekly dependency updates (free on every plan). Commit messages follow Conventional Commits: chore(deps) releases
# nothing; a security fix still deserves a fix(deps) title when merged, since the bundle ships the dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      mcp-sdk:
        patterns: ['@modelcontextprotocol/*', 'zod']
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@modelcontextprotocol/*', 'zod', 'pino', '@sentry/*']
        # majors come one per pull request, so one that breaks doesn't hold back the rest
        update-types: [minor, patch]
    ignore:
      # follow the Node version the package supports (engines, .nvmrc), not the newest
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler): not yet supported by openapi-typescript and typescript-eslint
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    ignore:
      # the image stays on the Node line CI tests (.nvmrc); move to the next LTS on purpose, everywhere at once
      - dependency-name: node
        update-types: ['version-update:semver-major']
